<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="cancont">
        <canvas id="can1"> </canvas>
        <canvas id="can2"> </canvas>
        <canvas id="can3"> </canvas>
        <canvas id="can4"> </canvas>
        <canvas id="can5"> </canvas>
        <canvas id="can6"> </canvas>
        <canvas id="can7"> </canvas>
    </div>
    <div id="topbox">
        <p class="font1">Player Health: <span id="plyhlt">100</span></p>
        <p class="font1">System Health: <span id="syshlt">80</span></p>
        <p class="font1">Keys: <span id="keys">0</span></p>
        <p class="font1">Shards Delivered: <span id="shards">0</span></p>
        <p class="font1">High Score: <span id="highscore">0</span></p>
    </div>

    <div id="resetbox">
        <button id="pause" class="font2">Pause</button>
        <button id="resume" class="font2">Resume</button>
        <button id="reset" class="font2">Reset</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
